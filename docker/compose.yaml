# Runs the whole app from the published images.
# Copy .env.example to .env in this folder, fill it in, then: docker compose up -d
# To build the images from this checkout instead, see compose.build.yaml.
name: money-buckets

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: abacus
      POSTGRES_USER: abacus_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "abacus_app", "-d", "abacus"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  server:
    image: ghcr.io/mattssawyer/money-buckets-server:latest
    depends_on:
      postgres:
        condition: service_healthy
    # Only this machine can reach the API directly. Anywhere else, serve it through an HTTPS
    # reverse proxy and set API_URL to that proxy's URL.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/abacus
      SPRING_DATASOURCE_USERNAME: abacus_app
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL in .env}
      CLERK_FRONTEND_API_URL: ${CLERK_FRONTEND_API_URL:?set CLERK_FRONTEND_API_URL in .env}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:?set PLAID_CLIENT_ID in .env}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
      PLAID_SECRET: ${PLAID_SECRET:?set PLAID_SECRET in .env}
      PLAID_TOKEN_ENCRYPTION_KEYSET: ${PLAID_TOKEN_ENCRYPTION_KEYSET:?set PLAID_TOKEN_ENCRYPTION_KEYSET in .env}
      PLAID_WEBHOOK_URL: ${PLAID_WEBHOOK_URL:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    restart: unless-stopped

  frontend:
    image: ghcr.io/mattssawyer/money-buckets-frontend:latest
    depends_on:
      - server
    ports:
      - "3000:8080"
    environment:
      VITE_API_BASE_URL: ${API_URL:?set API_URL in .env}
      VITE_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?set CLERK_PUBLISHABLE_KEY in .env}
      VITE_PRIMEUI_LICENSE_KEY: ${PRIMEUI_LICENSE_KEY:-}
    restart: unless-stopped

  # Gives Plaid a public HTTPS URL for its webhooks, so transactions keep syncing after
  # accounts are linked. Starts only when .env sets COMPOSE_PROFILES=webhook.
  ngrok:
    image: ngrok/ngrok:3
    profiles: [webhook]
    depends_on:
      - server
    command: ["http", "server:8080", "--url", "https://${NGROK_DOMAIN:-}"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    restart: unless-stopped

volumes:
  postgres-data:
