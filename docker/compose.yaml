# Runs the whole app from the published images.
# Copy .env.example to .env in this folder, fill it in, then: docker compose up -d
# To build the images from this checkout instead, see compose.build.yaml.
name: money-buckets

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: abacus
      POSTGRES_USER: abacus_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # The database lives in ./data, so moving this folder moves the app with its data.
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "abacus_app", "-d", "abacus"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  server:
    image: ghcr.io/mattssawyer/money-buckets-server:latest
    depends_on:
      postgres:
        condition: service_healthy
    # Browsers reach the API through the frontend at /api. This port is only for calling it
    # directly from this machine.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/abacus
      SPRING_DATASOURCE_USERNAME: abacus_app
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CLERK_FRONTEND_API_URL: ${CLERK_FRONTEND_API_URL:?set CLERK_FRONTEND_API_URL in .env}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:?set PLAID_CLIENT_ID in .env}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
      PLAID_SECRET: ${PLAID_SECRET:?set PLAID_SECRET in .env}
      # Generated into the server-data volume on first start unless set in .env.
      PLAID_TOKEN_ENCRYPTION_KEYSET: ${PLAID_TOKEN_ENCRYPTION_KEYSET:-}
      PLAID_TOKEN_ENCRYPTION_KEYSET_FILE: /app/data/plaid-keyset.json
      # Only with the webhooks profile; otherwise the server syncs every few hours instead.
      PLAID_WEBHOOK_URL: ${NGROK_DOMAIN:+https://${NGROK_DOMAIN}/api/plaid/webhook}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    # A Docker volume rather than a folder here, so the server's non-root user can write to it.
    volumes:
      - server-data:/app/data
    restart: unless-stopped

  frontend:
    image: ghcr.io/mattssawyer/money-buckets-frontend:latest
    depends_on:
      - server
    ports:
      - "3000:8080"
    environment:
      VITE_API_BASE_URL: ${API_URL:-/api}
      VITE_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?set CLERK_PUBLISHABLE_KEY in .env}
      VITE_PRIMEUI_LICENSE_KEY: ${PRIMEUI_LICENSE_KEY:-}
    restart: unless-stopped

  # Optional: gives Plaid a public HTTPS URL for its webhooks, so new transactions arrive
  # within minutes rather than at the next scheduled sync. Turn it on with
  # COMPOSE_PROFILES=webhooks in .env.
  ngrok:
    image: ngrok/ngrok:3
    profiles: [webhooks]
    depends_on:
      - server
    command: ["http", "server:8080", "--url", "https://${NGROK_DOMAIN:-}"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    restart: unless-stopped

volumes:
  server-data:
