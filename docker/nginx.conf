server {
    listen 8080;
    root /usr/share/nginx/html;

    # Docker's DNS, so nginx looks up the server when a request comes in and still starts
    # while the server is down.
    resolver 127.0.0.11 valid=10s;

    # The API is served from the app's own address, so it works from any machine that can
    # open the app.
    location /api/ {
        set $api http://server:8080;
        proxy_pass $api;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Same-origin requests need no CORS. Dropping Origin stops Spring from treating
        # them as cross-origin when the app's address differs from FRONTEND_URL.
        proxy_set_header Origin "";
    }

    # Vite names built assets by their contents, so they can be kept forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # Checked with the server on every load, so a new version shows up without a hard refresh.
        add_header Cache-Control "no-cache";
        # The rest of the policy is a <meta> tag in index.html; a <meta> can't stop framing.
        add_header Content-Security-Policy "frame-ancestors 'none'";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header X-Content-Type-Options "nosniff";
        # Vue Router uses history mode, so unknown paths load the app.
        try_files $uri $uri/ /index.html;
    }
}
