server {
    listen 8080;
    root /usr/share/nginx/html;

    # Docker's DNS, so nginx looks up the server when a request comes in and still starts
    # while the server is down.
    resolver 127.0.0.11 valid=10s;

    # The API is served from the app's own address, so it works from any machine that can
    # open the app.
    location /api/ {
        set $api http://server:8080;
        proxy_pass $api;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Same-origin requests need no CORS. Dropping Origin stops Spring from treating
        # them as cross-origin when the app's address differs from FRONTEND_URL.
        proxy_set_header Origin "";
    }

    location / {
        # Vue Router uses history mode, so unknown paths load the app.
        try_files $uri $uri/ /index.html;
    }
}
