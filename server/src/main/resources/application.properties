spring.application.name=money-buckets

spring.frontend.url=http://localhost:5173

spring.config.import=optional:file:.env[.properties]

server.servlet.context-path=/api

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/abacus}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:abacus_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:abacus_app}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Users sign in with WorkOS AuthKit, which signs their access tokens with keys kept per client ID.
workos.client-id=${WORKOS_CLIENT_ID}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://api.workos.com/sso/jwks/${workos.client-id}
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://api.workos.com/user_management/${workos.client-id}

# Public URL Plaid posts transaction updates to; empty locally unless a tunnel is running.
plaid.webhook.url=${PLAID_WEBHOOK_URL:}

# Keep Spring's default executor even though plaidSyncExecutor exists, so Plaid syncs
# cannot starve anything else that needs a thread.
spring.task.execution.mode=force

# Sorts transactions into spending plan buckets; sorting is skipped when empty.
typesafe.api-key=${TYPESAFE_API_KEY:}

# WorkOS API key, used only to delete a user's sign-in when they delete their account;
# deleting accounts is refused while it's empty.
workos.api-key=${WORKOS_API_KEY:}
