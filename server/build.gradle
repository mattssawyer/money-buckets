// The Spring Boot plugin pulls in old, vulnerable commons-lang3 and Jackson at build time.
buildscript {
	dependencies {
		constraints {
			classpath 'org.apache.commons:commons-lang3:3.20.0'
			classpath 'tools.jackson.core:jackson-core:3.1.7'
			classpath 'tools.jackson.core:jackson-databind:3.1.7'
		}
	}
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.matthewsawyer'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

// Patched versions ahead of what Spring Boot 4.1.1 picks, for Dependabot alerts.
ext['tomcat.version'] = '11.0.26'
ext['jackson-bom.version'] = '3.1.7'

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'com.plaid:plaid-java:29.0.0'
	implementation 'com.google.crypto.tink:tink:1.23.0'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'com.h2database:h2'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// plaid-java 29 pulls in old, vulnerable versions of these.
	constraints {
		implementation 'com.squareup.okio:okio:3.18.2'
		implementation 'org.json:json:20260814'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
