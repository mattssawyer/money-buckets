name: Dependency submission

# GitHub can't read Gradle builds on its own, so without this Dependabot never sees the
# server's Java dependencies and raises no alerts for them.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/dependency-submission@v4
        with:
          build-root-directory: server
